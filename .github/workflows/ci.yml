name: CI — build e check dati
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Genera il sito
        run: node build.js
      - name: Sintassi dei workflow
        run: npx --yes yaml-lint ".github/workflows/*.yml"
      - name: Check dati, link e H1
        run: node build.js --check
